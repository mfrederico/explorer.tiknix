; Architecture Explorer sidecar config (copy to config.ini; config.ini is gitignored).
; The sidecar REUSES core's vendor + shared classes; it only needs its own identity,
; its own db, and the shared SSO secret.

[app]
name = "Architecture Explorer"
baseurl = "https://explorer.tiknix.com"
session_name = "EXPLORER_SESSION"
debug = false
; Builder tooling is always OFF here — this is a leaf, not a control plane.
builder_tools_enabled = false

[database]
; The sidecar's OWN sqlite (sessions/nonces/graph cache). Relative to the app root.
type = "sqlite"
path = "data/explorer.db"

[explorer]
; MUST equal [explorer] sso_secret in the CORE tiknix config.ini — it verifies the
; SSO handoff token. Generate once: openssl rand -hex 32
sso_secret = ""
; Absolute path to the core tiknix checkout (for vendor, shared classes, and the
; read-only identity/ownership DB). Instances are resolved relative to its parent.
core_root = "/var/www/html/default/tiknix"
; Public base URL of core, for bouncing un-authenticated visitors to the launch link.
core_url = "https://tiknix.com"
